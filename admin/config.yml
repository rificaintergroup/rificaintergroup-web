backend:
  name: github
  repo: rificaintergroup/rificaintergroup-web
  branch: main
  base_url: https://decap-cms-oauth.netlify.app
  auth_endpoint: auth

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "index"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Body", name: "body", widget: "markdown"}
